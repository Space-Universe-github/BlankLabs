<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic Meta -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlankLabs</title>
  <meta name="description" content="Explore projects, writings, and experiments in tech, design, and creativity at BlankLabs.">
  <meta name="keywords" content="tech, projects, portfolio, writing, experiments, BlankLabs">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://blanklabs.site/">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="BlankLabs">
  <meta property="og:description" content="Explore projects, writings, and experiments in tech, design, and creativity at BlankLabs.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blanklabs.site/">
  <meta property="og:image" content="https://blanklabs.site/logo.png">
  <meta property="og:site_name" content="BlankLabs">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@toldblank">
  <meta name="twitter:title" content="BlankLabs">
  <meta name="twitter:description" content="Explore projects, writings, and experiments in tech, design, and creativity at BlankLabs.">
  <meta name="twitter:image" content="https://blanklabs.site/logo.png">

  <!-- Favicons / App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#d97c2a">
  <meta name="msapplication-TileColor" content="#100d08">
  <meta name="theme-color" content="#100d08">

  <!-- Fonts / Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/logo.png">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "BlankLabs",
    "url": "https://blanklabs.site/",
    "description": "Explore projects, writings, and experiments in tech, design, and creativity at BlankLabs.",
    "publisher": {
      "@type": "Organization",
      "name": "BlankLabs",
      "logo": {
        "@type": "ImageObject",
        "url": "https://blanklabs.site/logo.png"
      }
    }
  }
  </script>
</head>
  <style>
    :root{--bg:#100d08;--bg2:#0c0a06;--surface:#1c1710;--surface2:#28200f;--border:#3a2c18;--accent:#d97c2a;--accent2:#b85e18;--text:#efe3ca;--text2:#b8996a;--text3:#7a6040;--font-body:'Crimson Pro',Georgia,serif;--font-display:'Playfair Display',Georgia,serif;--font-mono:'DM Mono','Courier New',monospace;--shadow:0 16px 48px rgba(0,0,0,.6);--radius:10px}
    [data-theme="light"]{--bg:#f8f3ea;--bg2:#f0e8d4;--surface:#f0e8d4;--surface2:#e6dac4;--border:#cdbf9e;--accent:#b85000;--accent2:#8c3c00;--text:#1e1508;--text2:#5a3e1a;--text3:#8a6a40}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;transition:background .25s,color .25s;overflow-x:hidden}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    button{cursor:pointer;font-family:inherit}
    img{max-width:100%;display:block}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.028;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px 180px}
    #particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
    #loader{position:fixed;inset:0;z-index:9000;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;transition:opacity .35s ease}
    #loader.out{opacity:0;pointer-events:none}
    .loader-mark{font-family:var(--font-display);font-size:2rem;font-weight:700;color:var(--accent);letter-spacing:.06em;animation:loadpulse 1.4s ease-in-out infinite}
    @keyframes loadpulse{0%,100%{opacity:.4}50%{opacity:1}}
    .loader-bar-wrap{width:180px;height:2px;background:var(--surface2);border-radius:2px;overflow:hidden}
    #loader-bar{height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width .22s linear;box-shadow:0 0 8px var(--accent)}
    .loader-label{font-family:var(--font-mono);font-size:.65rem;color:var(--text3);letter-spacing:.1em}
    #app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:2rem 1.75rem 4rem;display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto 1fr;gap:1.25rem;align-items:start}
    @media(max-width:900px){#app{grid-template-columns:1fr;padding:1.25rem 1.1rem 4rem}}
    #site-header{grid-column:1/-1;display:flex;align-items:center;gap:1.25rem;padding:.9rem 0;border-bottom:1px solid var(--border);margin-bottom:.35rem}
    .brand-logo{width:46px;height:46px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--surface);border:1px solid var(--border)}
    .brand-logo img{width:100%;height:100%;object-fit:cover}
    .brand-text{display:flex;flex-direction:column;gap:.1rem}
    .brand-name{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--accent);letter-spacing:.04em;line-height:1}
    .brand-tagline{font-family:var(--font-mono);font-size:.62rem;color:var(--text3);letter-spacing:.08em}
    .hdr-space{flex:1}
    .hdr-controls{display:flex;gap:.6rem;align-items:center}
    .hdr-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);font-family:var(--font-mono);font-size:.68rem;padding:.35rem .75rem;border-radius:5px;letter-spacing:.06em;transition:all .18s}
    .hdr-btn:hover{border-color:var(--accent);color:var(--accent)}
    #main-col{display:flex;flex-direction:column;gap:0}
    #hero{padding:2.5rem 0 2rem;border-bottom:1px solid var(--border)}
    .hero-eyebrow{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:.85rem}
    .hero-title{font-family:var(--font-display);font-size:clamp(2.4rem,5vw,3.8rem);font-weight:700;line-height:1.08;letter-spacing:-.025em;margin-bottom:1rem}
    .hero-title em{font-style:italic;color:var(--text2)}
    #hero-bio{font-size:1.05rem;color:var(--text2);line-height:1.7;max-width:580px;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
    #hero-bio.vis{opacity:1;transform:none}
    .tabs-bar{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tabs-bar::-webkit-scrollbar{display:none}
    .tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:.9rem 1.1rem;transition:all .2s;white-space:nowrap;margin-bottom:-1px}
    .tab-btn:hover{color:var(--text2)}
    .tab-btn.on{color:var(--accent);border-bottom-color:var(--accent)}
    .panel{display:none;padding-top:2rem}
    .panel.on{display:block}
    .hl-label{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);padding-bottom:.75rem;border-bottom:1px solid var(--border);margin-bottom:1.25rem}
    .hl-item{display:flex;align-items:baseline;gap:.75rem;padding:.65rem 0;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);cursor:pointer;transition:all .18s}
    .hl-item:hover{padding-left:.4rem}
    .hl-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:.4rem}
    .hl-item-title{font-family:var(--font-display);font-size:1rem;font-weight:600;color:var(--text);flex-shrink:0}
    .hl-item-desc{font-size:.88rem;color:var(--text3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hl-type{font-family:var(--font-mono);font-size:.6rem;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;flex-shrink:0}
    .search-input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:.9rem;padding:.5rem .85rem;border-radius:5px;outline:none;transition:border-color .18s;width:100%}
    .search-input::placeholder{color:var(--text3)}
    .search-input:focus{border-color:var(--accent)}
    #pf-search-wrap,#blog-search-wrap{margin-bottom:1.5rem}
    #pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
    .pf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .22s;display:flex;flex-direction:column}
    .pf-card:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);transform:translateY(-3px);box-shadow:var(--shadow)}
    .pf-card-img{width:100%;height:150px;object-fit:cover;display:block;transition:transform .3s ease}
    .pf-card:hover .pf-card-img{transform:scale(1.04)}
    .pf-card-img-wrap{overflow:hidden}
    .pf-card-body{padding:.9rem}
    .pf-card-title{font-family:var(--font-display);font-size:1rem;font-weight:600;margin-bottom:.3rem}
    .pf-card-desc{font-size:.83rem;color:var(--text3);line-height:1.5}
    .pf-card-tags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.6rem}
    .pf-tag{font-family:var(--font-mono);font-size:.58rem;color:var(--text3);border:1px solid var(--border);padding:.12rem .4rem;border-radius:3px;letter-spacing:.06em}
    .post-list{display:flex;flex-direction:column;gap:0}
    .post-item{padding:1.25rem 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .18s;display:grid;grid-template-columns:1fr auto;gap:.75rem;align-items:start}
    .post-item:hover{padding-left:.5rem}
    .post-item:hover .post-title{color:var(--accent)}
    .post-title{font-family:var(--font-display);font-size:1.2rem;font-weight:600;line-height:1.25;margin-bottom:.25rem;transition:color .18s}
    .post-sub{font-size:.88rem;color:var(--text2);font-style:italic;margin-bottom:.4rem}
    .post-desc{font-size:.85rem;color:var(--text3);line-height:1.5}
    .post-meta{font-family:var(--font-mono);font-size:.62rem;color:var(--text3);text-align:right;white-space:nowrap;padding-top:.2rem}
    .post-arr{color:var(--accent);font-size:.75rem;margin-top:.3rem;display:block}
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    @media(max-width:600px){.contact-grid{grid-template-columns:1fr}}
    .contact-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;transition:border-color .18s}
    .contact-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
    .contact-card-label{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
    .contact-card-val{font-family:var(--font-display);font-size:1rem;color:var(--text)}
    .contact-card-val a{color:var(--accent)}
    #sidebar{display:flex;flex-direction:column;gap:1.25rem;position:sticky;top:1.5rem}
    @media(max-width:900px){#sidebar{position:static}}
    .side-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
    .side-card-hdr{padding:.75rem 1rem;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text3)}
    .side-item{display:flex;gap:.75rem;align-items:center;padding:.75rem 1rem;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);cursor:pointer;transition:background .15s}
    .side-item:last-child{border-bottom:none}
    .side-item:hover{background:var(--surface2)}
    .side-thumb{width:54px;height:42px;object-fit:cover;border-radius:5px;flex-shrink:0;background:var(--surface2)}
    .side-item-body{flex:1;min-width:0}
    .side-item-title{font-family:var(--font-display);font-size:.88rem;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side-item-sub{font-size:.75rem;color:var(--text3);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side-arr{color:var(--text3);font-size:.75rem;flex-shrink:0}
    .side-footer{padding:.6rem 1rem;font-family:var(--font-mono);font-size:.62rem;color:var(--text3);text-align:center;border-top:1px solid var(--border)}
    .side-footer a{color:var(--accent)}
    #site-footer{grid-column:1/-1;margin-top:1rem;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
    .foot-copy{font-family:var(--font-mono);font-size:.65rem;color:var(--text3);letter-spacing:.06em}
    .foot-links{display:flex;gap:1rem}
    .foot-links a{font-family:var(--font-mono);font-size:.65rem;color:var(--text3);transition:color .15s}
    .foot-links a:hover{color:var(--accent);text-decoration:none}
    .modal-bg{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1.5rem}
    .modal-bg.open{display:flex}
    .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:min(740px,100%);max-height:88vh;overflow-y:auto;position:relative;box-shadow:var(--shadow);transform:translateY(8px);opacity:0;animation:mopen .22s ease forwards}
    @keyframes mopen{to{transform:none;opacity:1}}
    .modal-close-btn{position:sticky;top:0;float:right;margin:.85rem .85rem 0 0;background:var(--surface2);border:1px solid var(--border);color:var(--text3);font-family:var(--font-mono);font-size:.65rem;padding:.28rem .6rem;border-radius:4px;transition:all .15s;z-index:10;cursor:pointer}
    .modal-close-btn:hover{color:var(--text);border-color:var(--accent)}
    .modal-inner{padding:1.6rem 1.75rem 2rem;clear:both}
    .modal-inner h2{font-family:var(--font-display);font-size:1.6rem;font-weight:700;letter-spacing:-.015em;margin-bottom:.4rem;line-height:1.2}
    .modal-inner h3{font-family:var(--font-display);font-size:1.15rem;font-weight:600;margin:1.6rem 0 .5rem;color:var(--text)}
    .modal-inner p{line-height:1.75;margin-bottom:1rem;color:var(--text)}
    .modal-inner ul{padding-left:1.3rem;margin-bottom:1rem}
    .modal-inner ul li{margin-bottom:.35rem;line-height:1.65}
    .modal-inner pre{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:1rem 1.1rem;overflow-x:auto;font-family:var(--font-mono);font-size:.82rem;line-height:1.6;margin-bottom:1rem}
    .modal-inner blockquote{border-left:3px solid var(--accent);padding-left:1rem;color:var(--text2);font-style:italic;margin:1rem 0}
    .modal-meta{font-family:var(--font-mono);font-size:.68rem;color:var(--text3);margin-bottom:1.5rem;letter-spacing:.04em}
    .modal-sub{font-family:var(--font-display);font-style:italic;font-size:1rem;color:var(--text2);margin-bottom:.5rem}
    .modal-img{width:100%;border-radius:8px;margin:1.25rem 0 .5rem;cursor:zoom-in}
    .modal-img-caption{font-size:.8rem;color:var(--text3);margin-bottom:1.25rem;text-align:center;font-style:italic}
    .modal-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
    .search-modal-bar{display:flex;gap:.75rem;margin-bottom:1.25rem;align-items:center}
    .search-modal-input{flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:.95rem;padding:.55rem .85rem;border-radius:5px;outline:none;transition:border-color .15s}
    .search-modal-input:focus{border-color:var(--accent)}
    .search-modal-input::placeholder{color:var(--text3)}
    .search-btn{background:var(--accent);border:none;color:#000;font-family:var(--font-mono);font-size:.7rem;padding:.5rem .9rem;border-radius:5px;font-weight:600;letter-spacing:.06em;transition:background .15s;cursor:pointer}
    .search-btn:hover{background:var(--accent2)}
    .search-status{font-family:var(--font-mono);font-size:.65rem;color:var(--text3);margin-bottom:.75rem}
    .search-hit{padding:.7rem 0;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);cursor:pointer}
    .search-hit:hover .search-hit-title{color:var(--accent)}
    .search-hit-type{font-family:var(--font-mono);font-size:.58rem;text-transform:uppercase;color:var(--accent);letter-spacing:.1em;margin-bottom:.2rem}
    .search-hit-title{font-family:var(--font-display);font-size:1rem;font-weight:600;transition:color .15s}
    .search-hit-sub{font-size:.82rem;color:var(--text3);margin-top:.15rem}
    #lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.94);align-items:center;justify-content:center;flex-direction:column}
    #lightbox.open{display:flex}
    #lb-img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:6px}
    #lb-caption{font-size:.8rem;color:rgba(255,255,255,.4);margin-top:.75rem;font-style:italic;text-align:center}
    #lb-close{position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:var(--font-mono);font-size:.65rem;padding:.3rem .65rem;border-radius:4px;transition:background .15s;cursor:pointer}
    #lb-close:hover{background:rgba(255,255,255,.15)}
    .reveal{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease}
    .reveal.vis{opacity:1;transform:none}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:var(--accent)}
    @media(max-width:600px){#app{padding:1rem .9rem 3rem}.hero-title{font-size:2.2rem}#pf-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<canvas id="particle-canvas" aria-hidden="true"></canvas>
<div id="loader" aria-label="Loading" role="status">
  <div class="loader-mark">◈ BlankLabs</div>
  <div class="loader-bar-wrap"><div id="loader-bar"></div></div>
  <div class="loader-label" id="loader-label">Initializing…</div>
</div>
<div id="app" style="visibility:hidden">
  <header id="site-header">
    <div class="brand-logo"><img id="brand-logo" src="/logo.png" alt="BlankLabs logo"></div>
    <div class="brand-text">
      <span class="brand-name">BlankLabs</span>
      <span class="brand-tagline">// projects · writing · experiments</span>
    </div>
    <div class="hdr-space"></div>
    <div class="hdr-controls">
      <button class="hdr-btn" id="open-search-btn">⌕ Search</button>
      <button class="hdr-btn" id="theme-btn">Light</button>
    </div>
  </header>
  <div id="main-col">
    <section id="hero">
      <div class="hero-eyebrow">◈ Blank&nbsp;Labs</div>
      <h1 class="hero-title">Projects, writing,<br><em>and experiments.</em></h1>
      <p id="hero-bio"></p>
    </section>
    <div class="tabs-bar" role="tablist" aria-label="Navigation">
      <button class="tab-btn on" role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button class="tab-btn" role="tab" data-tab="portfolio" aria-selected="false">Portfolio</button>
      <button class="tab-btn" role="tab" data-tab="writing" aria-selected="false">Writing</button>
      <button class="tab-btn" role="tab" data-tab="contact" aria-selected="false">Contact</button>
    </div>
    <div class="panel on" id="panel-overview">
      <div class="hl-label">Featured</div>
      <div id="overview-highlights"></div>
    </div>
    <div class="panel" id="panel-portfolio">
      <div id="pf-search-wrap"><input type="search" class="search-input" id="pf-search" placeholder="Search projects…" aria-label="Search projects"></div>
      <div id="pf-grid"></div>
    </div>
    <div class="panel" id="panel-writing">
      <div id="blog-search-wrap"><input type="search" class="search-input" id="blog-search" placeholder="Search posts…" aria-label="Search posts"></div>
      <div id="post-list" class="post-list"></div>
    </div>
    <div class="panel" id="panel-contact">
      <div class="contact-grid">
        <div class="contact-card"><div class="contact-card-label">Email</div><div class="contact-card-val"><a href="mailto:blank@blanklabs.site">blank@blanklabs.site</a></div></div>
      </div>
    </div>
  </div>
  <aside id="sidebar">
    <div class="side-card">
      <div class="side-card-hdr">Recent portfolio</div>
      <div id="sidebar-portfolio"></div>
      <div class="side-footer"><a href="#" data-jumptab="portfolio">View all →</a></div>
    </div>
    <div class="side-card">
      <div class="side-card-hdr">Recent writing</div>
      <div id="sidebar-writing"></div>
      <div class="side-footer"><a href="./blogs/" target="_blank">Open blog reader →</a></div>
    </div>
  </aside>
  <footer id="site-footer">
    <span class="foot-copy">© <span id="foot-year"></span> BlankLabs</span>
    <div class="foot-links">
      <a href="./blogs/">Blog</a>
      <a href="mailto:blank@blanklabs.site">Email</a>
    </div>
  </footer>
</div>
<div class="modal-bg" id="search-modal" role="dialog" aria-modal="true" aria-label="Search">
  <div class="modal-box">
    <button class="modal-close-btn" id="search-modal-close">✕ close</button>
    <div class="modal-inner">
      <h2 style="margin-bottom:1rem">Search</h2>
      <div class="search-modal-bar">
        <input class="search-modal-input" id="search-input" placeholder="Search projects and posts…" autocomplete="off">
        <button class="search-btn" id="run-search">Go</button>
      </div>
      <div class="search-status" id="search-status"></div>
      <div id="search-results"></div>
    </div>
  </div>
</div>
<div class="modal-bg" id="content-modal" role="dialog" aria-modal="true" aria-label="Content">
  <div class="modal-box">
    <button class="modal-close-btn" id="content-modal-close">✕ close</button>
    <div class="modal-inner" id="content-modal-body"></div>
  </div>
</div>
<div id="lightbox" role="dialog" aria-label="Image viewer">
  <button id="lb-close">✕ close</button>
  <img id="lb-img" src="" alt="">
  <div id="lb-caption"></div>
</div>
<script>
(function(){
'use strict';
const PATHS={bio:'/bio.json',portfolio:'/portfolio.json',blogs:'/blogs.json',settings:'/settings.json',logo:'/logo.png',placeholder:'/placeholder.png'};
let _pf=[],_bl=[];
const $=id=>document.getElementById(id);
const qsa=s=>document.querySelectorAll(s);
function setBar(p){$('loader-bar').style.width=Math.round(p*100)+'%'}
function fmtDate(s){if(!s)return'';try{return new Date(s+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}catch{return s}}
function resolveSrc(src){if(!src)return PATHS.placeholder;if(src.startsWith('http')||src.startsWith('/')||src.startsWith('data:'))return src;return'/'+src}
async function fetchJSON(url,timeout=2500){try{const c=new AbortController();const id=setTimeout(()=>c.abort(),timeout);const r=await fetch(url,{signal:c.signal,cache:'no-cache'});clearTimeout(id);if(!r.ok)return null;return await r.json()}catch{return null}}

// Particles
const canvas=$('particle-canvas');
const ctx=canvas.getContext('2d');
let particles=[];
function makeParticles(){
  const w=canvas.width=window.innerWidth,h=canvas.height=window.innerHeight;
  particles=[];
  const isDark=document.documentElement.dataset.theme!=='light';
  const count=Math.round(w/22);
  for(let i=0;i<count;i++){
    const size=3+Math.random()*14;
    particles.push({x:Math.random()*w,y:Math.random()*h,size,speed:0.08+Math.random()*0.22,drift:(Math.random()-.5)*0.06,opacity:(0.03+Math.random()*0.07)*(isDark?1:.6),color:Math.random()>.5?`rgba(217,124,42,${0.08+Math.random()*0.07})`:`rgba(90,60,20,${0.06+Math.random()*0.05})`});
  }
}
function animParticles(){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  for(const p of particles){
    ctx.save();ctx.globalAlpha=p.opacity;ctx.fillStyle=p.color;ctx.beginPath();
    ctx.roundRect(p.x,p.y,p.size,p.size,p.size*.25);ctx.fill();ctx.restore();
    p.y-=p.speed;p.x+=p.drift;
    if(p.y+p.size<0){p.y=h+p.size;p.x=Math.random()*w}
    if(p.x>w+p.size){p.x=-p.size}
    if(p.x<-p.size){p.x=w+p.size}
  }
  requestAnimationFrame(animParticles);
}
window.addEventListener('resize',()=>{clearTimeout(window._pr);window._pr=setTimeout(makeParticles,250)});

// Theme
function applyTheme(name){
  if(name==='dark'){document.documentElement.removeAttribute('data-theme');$('theme-btn').textContent='Light'}
  else{document.documentElement.setAttribute('data-theme','light');$('theme-btn').textContent='Dark'}
  localStorage.setItem('bl_theme',name);setTimeout(makeParticles,80);
}
$('theme-btn').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme==='light'?'light':'dark';applyTheme(cur==='dark'?'light':'dark')});
const savedTheme=localStorage.getItem('bl_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
applyTheme(savedTheme);

// Tabs
const tabBtns=qsa('.tab-btn');
function switchTab(name){
  tabBtns.forEach(b=>{const on=b.dataset.tab===name;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  qsa('.panel').forEach(p=>p.classList.remove('on'));
  const panel=$('panel-'+name);if(panel)panel.classList.add('on');
  localStorage.setItem('bl_tab',name);
}
tabBtns.forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
qsa('[data-jumptab]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();switchTab(a.dataset.jumptab)}));

// Lightbox
function openLB(src,caption){$('lb-img').src=resolveSrc(src);$('lb-caption').textContent=caption||'';$('lightbox').classList.add('open');document.body.style.overflow='hidden'}
function closeLB(){$('lightbox').classList.remove('open');document.body.style.overflow='';$('lb-img').src=''}
$('lb-close').addEventListener('click',closeLB);
$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))closeLB()});

// Safe img
function safeImg(src,alt,cls){
  const img=document.createElement('img');
  img.src=resolveSrc(src)||PATHS.placeholder;img.alt=alt||'';
  if(cls)img.className=cls;img.loading='lazy';
  img.onerror=()=>{if(!img.src.endsWith(PATHS.placeholder))img.src=PATHS.placeholder};
  img.addEventListener('dragstart',e=>e.preventDefault());
  return img;
}

// Modals
function openModal(id){const m=$(id);m.classList.add('open');document.body.style.overflow='hidden';const f=m.querySelector('input,button');if(f)f.focus()}
function closeModal(id){$(id).classList.remove('open');document.body.style.overflow=''}
$('search-modal-close').addEventListener('click',()=>closeModal('search-modal'));
$('content-modal-close').addEventListener('click',()=>closeModal('content-modal'));
$('search-modal').addEventListener('click',e=>{if(e.target===$('search-modal'))closeModal('search-modal')});
$('content-modal').addEventListener('click',e=>{if(e.target===$('content-modal'))closeModal('content-modal')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLB();closeModal('content-modal');closeModal('search-modal')}});

// Block renderer
function renderBlock(b){
  if(!b||!b.type)return null;
  if(b.type==='text'){
    if(b.format==='header'){const h=document.createElement('h3');h.textContent=b.content||'';return h}
    if(b.format==='list'){const ul=document.createElement('ul');(b.items||[]).forEach(it=>{const li=document.createElement('li');li.textContent=it;ul.appendChild(li)});return ul}
    const p=document.createElement('p');p.textContent=b.content||'';return p;
  }
  if(b.type==='image'){
    const wrap=document.createElement('div');
    const img=safeImg(b.src,b.caption,'modal-img');
    img.addEventListener('click',()=>openLB(b.src,b.caption));wrap.appendChild(img);
    if(b.caption){const cap=document.createElement('div');cap.className='modal-img-caption';cap.textContent=b.caption;wrap.appendChild(cap)}
    return wrap;
  }
  if(b.type==='code'){const pre=document.createElement('pre');pre.textContent=b.content||'';return pre}
  if(b.type==='accordion'){
    const d=document.createElement('details');d.style.cssText='background:var(--surface2);padding:.75rem 1rem;border-radius:8px;margin:.5rem 0;border:1px solid var(--border)';
    const s=document.createElement('summary');s.style.cssText='cursor:pointer;font-weight:600;font-family:var(--font-display)';s.textContent=b.title||'More';d.appendChild(s);
    (b.blocks||[]).forEach(inner=>{const n=renderBlock(inner);if(n)d.appendChild(n)});return d;
  }
  return null;
}

// Open post in new tab via blog reader
function openPostFull(post){window.open('./blogs/?id='+post.id,'_blank')}

// Open project modal
function openProjectModal(item){
  const body=$('content-modal-body');body.innerHTML='';
  const h2=document.createElement('h2');h2.textContent=item.title||'Untitled';body.appendChild(h2);
  if(item.date){const m=document.createElement('div');m.className='modal-meta';m.textContent=fmtDate(item.date);body.appendChild(m)}
  if(item.description){const p=document.createElement('p');p.textContent=item.description;body.appendChild(p)}
  if(item.tags&&item.tags.length){const tw=document.createElement('div');tw.className='modal-tags';item.tags.forEach(t=>{const s=document.createElement('span');s.className='pf-tag';s.textContent=t;tw.appendChild(s)});body.appendChild(tw)}
  const imgs=item.images&&item.images.length?item.images:(item.image?[item.image]:[]);
  imgs.forEach(src=>{const img=safeImg(src,item.title,'modal-img');img.addEventListener('click',()=>openLB(src,item.title));body.appendChild(img)});
  openModal('content-modal');
}

// Render portfolio
function renderPortfolio(list){
  const grid=$('pf-grid');grid.innerHTML='';
  if(!list||!list.length){grid.textContent='No projects yet.';return}
  list.forEach((item,i)=>{
    const card=document.createElement('div');card.className='pf-card reveal';card.style.transitionDelay=(i*50)+'ms';
    const imgWrap=document.createElement('div');imgWrap.className='pf-card-img-wrap';
    const firstSrc=(item.images&&item.images[0])||item.image||PATHS.placeholder;
    const img=safeImg(firstSrc,item.title,'pf-card-img');
    img.addEventListener('click',e=>{e.stopPropagation();openLB(firstSrc,item.title)});
    imgWrap.appendChild(img);card.appendChild(imgWrap);
    const body=document.createElement('div');body.className='pf-card-body';
    const title=document.createElement('div');title.className='pf-card-title';title.textContent=item.title||'Untitled';body.appendChild(title);
    if(item.description){const d=document.createElement('div');d.className='pf-card-desc';d.textContent=item.description.slice(0,110);body.appendChild(d)}
    if(item.tags&&item.tags.length){const tw=document.createElement('div');tw.className='pf-card-tags';item.tags.slice(0,4).forEach(t=>{const s=document.createElement('span');s.className='pf-tag';s.textContent=t;tw.appendChild(s)});body.appendChild(tw)}
    card.appendChild(body);card.addEventListener('click',()=>openProjectModal(item));grid.appendChild(card);
  });
  initReveal();
}

// Render posts
function renderPosts(list){
  const el=$('post-list');el.innerHTML='';
  if(!list||!list.length){el.textContent='No posts yet.';return}
  list.forEach((post,i)=>{
    const item=document.createElement('div');item.className='post-item reveal';item.style.transitionDelay=(i*40)+'ms';
    const left=document.createElement('div');
    const title=document.createElement('div');title.className='post-title';title.textContent=post.title||'Untitled';left.appendChild(title);
    if(post.subtitle){const sub=document.createElement('div');sub.className='post-sub';sub.textContent=post.subtitle;left.appendChild(sub)}
    if(post.description){const desc=document.createElement('div');desc.className='post-desc';desc.textContent=post.description.slice(0,140);left.appendChild(desc)}
    const right=document.createElement('div');
    const meta=document.createElement('div');meta.className='post-meta';meta.textContent=fmtDate(post.date);
    const arr=document.createElement('span');arr.className='post-arr';arr.textContent='→';
    right.appendChild(meta);right.appendChild(arr);
    item.appendChild(left);item.appendChild(right);
    item.addEventListener('click',()=>openPostFull(post));
    el.appendChild(item);
  });
  initReveal();
}

// Sidebar
function renderSidebarPortfolio(list){
  const el=$('sidebar-portfolio');el.innerHTML='';
  if(!list||!list.length){el.innerHTML='<div style="padding:.75rem 1rem;font-size:.82rem;color:var(--text3)">No projects yet.</div>';return}
  list.slice(0,3).forEach(item=>{
    const row=document.createElement('div');row.className='side-item';
    const firstSrc=(item.images&&item.images[0])||item.image||PATHS.placeholder;
    const img=safeImg(firstSrc,item.title,'side-thumb');
    img.addEventListener('click',e=>{e.stopPropagation();openLB(firstSrc,item.title)});
    const body=document.createElement('div');body.className='side-item-body';
    const t=document.createElement('div');t.className='side-item-title';t.textContent=item.title||'Untitled';body.appendChild(t);
    if(item.description){const s=document.createElement('div');s.className='side-item-sub';s.textContent=item.description.slice(0,60);body.appendChild(s)}
    const arr=document.createElement('span');arr.className='side-arr';arr.textContent='›';
    row.appendChild(img);row.appendChild(body);row.appendChild(arr);
    row.addEventListener('click',()=>openProjectModal(item));el.appendChild(row);
  });
}
function renderSidebarWriting(list){
  const el=$('sidebar-writing');el.innerHTML='';
  if(!list||!list.length){el.innerHTML='<div style="padding:.75rem 1rem;font-size:.82rem;color:var(--text3)">No posts yet.</div>';return}
  list.slice(0,3).forEach(post=>{
    const row=document.createElement('div');row.className='side-item';
    const thumb=(post.blocks||[]).find(b=>b.type==='image'&&b.src);
    const img=safeImg(thumb?thumb.src:PATHS.placeholder,post.title,'side-thumb');
    if(thumb)img.addEventListener('click',e=>{e.stopPropagation();openLB(thumb.src,post.title)});
    const body=document.createElement('div');body.className='side-item-body';
    const t=document.createElement('div');t.className='side-item-title';t.textContent=post.title||'Untitled';body.appendChild(t);
    if(post.subtitle){const s=document.createElement('div');s.className='side-item-sub';s.textContent=post.subtitle.slice(0,60);body.appendChild(s)}
    const arr=document.createElement('span');arr.className='side-arr';arr.textContent='›';
    row.appendChild(img);row.appendChild(body);row.appendChild(arr);
    row.addEventListener('click',()=>openPostFull(post));el.appendChild(row);
  });
}

// Highlights
function renderHighlights(portfolio,blogs){
  const el=$('overview-highlights');el.innerHTML='';
  const pool=[];
  (portfolio||[]).forEach(p=>pool.push({type:'project',data:p,title:p.title,desc:p.description||''}));
  (blogs||[]).forEach(b=>pool.push({type:'post',data:b,title:b.title,desc:b.subtitle||b.description||''}));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const picks=pool.slice(0,Math.min(6,pool.length));
  if(!picks.length){el.textContent='Nothing here yet.';return}
  picks.forEach((pick,i)=>{
    const row=document.createElement('div');row.className='hl-item reveal';row.style.transitionDelay=(i*55)+'ms';
    const dot=document.createElement('div');dot.className='hl-dot';
    const title=document.createElement('div');title.className='hl-item-title';title.textContent=pick.title||'Untitled';
    const desc=document.createElement('div');desc.className='hl-item-desc';desc.textContent=(pick.desc||'').slice(0,80);
    const type=document.createElement('div');type.className='hl-type';type.textContent=pick.type==='post'?'Post':'Project';
    row.appendChild(dot);row.appendChild(title);row.appendChild(desc);row.appendChild(type);
    row.addEventListener('click',()=>{if(pick.type==='post')openPostFull(pick.data);else openProjectModal(pick.data)});
    el.appendChild(row);
  });
  initReveal();
}

// Search
$('open-search-btn').addEventListener('click',()=>{$('search-input').value='';$('search-results').innerHTML='';$('search-status').textContent='';openModal('search-modal')});
function doSearch(q){
  const res=$('search-results'),status=$('search-status');
  if(!q){status.textContent='Type something to search.';return}
  const qlow=q.toLowerCase();
  const pfHits=_pf.filter(it=>((it.title||'')+' '+(it.description||'')+' '+(it.tags||[]).join(' ')).toLowerCase().includes(qlow));
  const blHits=_bl.filter(p=>((p.title||'')+' '+(p.subtitle||'')+' '+(p.description||'')+' '+JSON.stringify(p.blocks||[])).toLowerCase().includes(qlow));
  res.innerHTML='';
  if(!pfHits.length&&!blHits.length){res.textContent='No results.';status.textContent='';return}
  status.textContent=`${pfHits.length+blHits.length} result(s)`;
  [...pfHits.map(d=>({type:'project',data:d})),...blHits.map(d=>({type:'post',data:d}))].forEach(hit=>{
    const row=document.createElement('div');row.className='search-hit';
    const tp=document.createElement('div');tp.className='search-hit-type';tp.textContent=hit.type==='post'?'Post':'Project';
    const title=document.createElement('div');title.className='search-hit-title';title.textContent=hit.data.title||'Untitled';
    const sub=document.createElement('div');sub.className='search-hit-sub';sub.textContent=(hit.data.subtitle||hit.data.description||'').slice(0,110);
    row.appendChild(tp);row.appendChild(title);row.appendChild(sub);
    row.addEventListener('click',()=>{closeModal('search-modal');if(hit.type==='post')openPostFull(hit.data);else openProjectModal(hit.data)});
    res.appendChild(row);
  });
}
$('run-search').addEventListener('click',()=>doSearch($('search-input').value.trim()));
$('search-input').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch($('search-input').value.trim())});
$('pf-search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();renderPortfolio(q?_pf.filter(it=>((it.title||'')+' '+(it.description||'')+' '+(it.tags||[]).join(' ')).toLowerCase().includes(q)):_pf)});
$('blog-search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();renderPosts(q?_bl.filter(p=>((p.title||'')+' '+(p.subtitle||'')+' '+(p.description||'')).toLowerCase().includes(q)):_bl)});

// Reveal
function initReveal(){
  if(!('IntersectionObserver' in window)){qsa('.reveal').forEach(e=>e.classList.add('vis'));return}
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target)}})},{threshold:.07});
  qsa('.reveal:not(.vis)').forEach(el=>obs.observe(el));
}

// Init
async function init(){
  const t0=Date.now();
  makeParticles();animParticles();
  setBar(.05);$('loader-label').textContent='Loading…';
  const[settings,bio,portfolio,blogs]=await Promise.all([fetchJSON(PATHS.settings,800),fetchJSON(PATHS.bio,1200),fetchJSON(PATHS.portfolio,1600),fetchJSON(PATHS.blogs,1600)]);
  if(settings&&settings.theme)applyTheme(settings.theme);
  setBar(.4);$('loader-label').textContent='Rendering…';
  const bioEl=$('hero-bio');
  bioEl.textContent=bio&&bio.bio?bio.bio:'Projects, experiments, and writing from BlankLabs.';
  _pf=Array.isArray(portfolio)?portfolio:[];
  _bl=Array.isArray(blogs)?blogs:[];
  renderPortfolio(_pf);renderPosts(_bl);renderSidebarPortfolio(_pf);renderSidebarWriting(_bl);renderHighlights(_pf,_bl);
  $('foot-year').textContent=new Date().getFullYear();
  const brandLogo=$('brand-logo');brandLogo.onerror=()=>{brandLogo.src=PATHS.placeholder};
  const savedT=localStorage.getItem('bl_tab');if(savedT)switchTab(savedT);
  setTimeout(()=>bioEl.classList.add('vis'),200);
  setBar(1);
  const wait=Math.max(0,520-(Date.now()-t0));
  setTimeout(()=>{
    const loader=$('loader');loader.classList.add('out');
    setTimeout(()=>{loader.style.display='none';$('app').style.visibility='visible';initReveal()},380);
  },wait);
}
init();
})();
</script>
</body>
</html>
