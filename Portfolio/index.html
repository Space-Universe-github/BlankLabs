<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="blanklabs — portfolio & photography">
<title>blanklabs — portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS & RESET
═══════════════════════════════════════════════════════════ */
:root {
  --bg: #0c0c0f; --bg2: #101013; --bg3: #141418; --surface: #18181d; --surface2: #1e1e24;
  --bdr: rgba(255,255,255,.07); --bdr2: rgba(255,255,255,.13); --bdr3: rgba(255,255,255,.2);
  --txt: #eae6dd; --txt2: rgba(234,230,221,.48); --txt3: rgba(234,230,221,.22); --txt4: rgba(234,230,221,.1);
  --card-bg: rgba(255,255,255,.028); --card-hov: rgba(255,255,255,.055);
  --sans: 'DM Sans',system-ui,sans-serif; --serif: 'DM Serif Display',Georgia,serif; --mono: 'JetBrains Mono',monospace;
  --ease: cubic-bezier(.4,0,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
}
[data-theme="light"] {
  --bg: #f4f1ec; --bg2: #ece8e1; --bg3: #e3dfd7; --surface: #dbd6cc; --surface2: #d3cdc2;
  --bdr: rgba(0,0,0,.07); --bdr2: rgba(0,0,0,.13); --bdr3: rgba(0,0,0,.22);
  --txt: #1c1916; --txt2: rgba(28,25,22,.48); --txt3: rgba(28,25,22,.3); --txt4: rgba(28,25,22,.1);
  --card-bg: rgba(0,0,0,.02); --card-hov: rgba(0,0,0,.045);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);font-family:var(--sans);
  min-height:100vh;overflow-x:hidden; display: flex; flex-direction: column;
  transition:background .45s var(--ease),color .45s var(--ease);
  -webkit-font-smoothing:antialiased;
}
*:focus-visible{outline:1px solid var(--bdr3);outline-offset:3px}

/* ═══════════════════════════════════════════════════════════
   GLOBAL UI (Loader, Canvas, Cursor, Corners)
═══════════════════════════════════════════════════════════ */
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;transition:opacity .6s var(--ease),transform .6s var(--ease);}
#loader.done{opacity:0;pointer-events:none;transform:translateY(-8px)}
.loader-face{font-size:1.8rem;font-family:var(--sans);font-weight:300;color:var(--txt2);animation:loader-pulse 1.4s ease-in-out infinite;}
@keyframes loader-pulse{0%,100%{opacity:.4}50%{opacity:1}}
.loader-bar-wrap{width:120px;height:1px;background:var(--bdr);overflow:hidden}
.loader-bar{height:100%;background:var(--txt3);width:0%;animation:loader-fill .9s var(--ease) .2s forwards;}
@keyframes loader-fill{to{width:100%}}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(700px at var(--mx,50%) var(--my,50%),rgba(200,180,140,.055) 0%,transparent 65%);transition:background .08s;}
[data-theme="light"] #glow{background:radial-gradient(600px at var(--mx,50%) var(--my,50%),rgba(100,80,40,.04) 0%,transparent 65%);}

#cursor{position:fixed;z-index:8000;pointer-events:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--bdr2);transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s,opacity .2s;mix-blend-mode:difference;opacity:0;}
#cursor.active{opacity:1} #cursor.big{width:52px;height:52px;border-color:var(--bdr3)}
body.touch-device #cursor{display:none}

.corner{position:fixed;width:16px;height:16px;border-color:var(--bdr2);border-style:solid;z-index:4;pointer-events:none;transition:border-color .45s var(--ease);}
.corner.tl{top:1.25rem;left:1.25rem;border-width:1px 0 0 1px} .corner.tr{top:1.25rem;right:1.25rem;border-width:1px 1px 0 0}
.corner.bl{bottom:1.25rem;left:1.25rem;border-width:0 0 1px 1px} .corner.br{bottom:1.25rem;right:1.25rem;border-width:0 1px 1px 0}
@media(max-width:480px){.corner{display:none}}

/* ═══════════════════════════════════════════════════════════
   NAV & FOOTER
═══════════════════════════════════════════════════════════ */
#nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:1.4rem 2.25rem;}
@media(max-width:560px){#nav{padding:1.1rem 1.25rem}}
.nav-l,.nav-r{display:flex;align-items:center;gap:.75rem}
.nav-tag{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);font-weight:400;}

#thm{width:38px;height:21px;border-radius:11px;background:var(--surface2);border:1px solid var(--bdr2);position:relative;cursor:pointer;transition:background .3s,border-color .3s;}
#thm::after{content:'';position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:var(--txt2);transition:left .25s var(--spring),background .3s;}
[data-theme="light"] #thm::after{left:20px;background:var(--txt)}

#footer{position:relative;z-index:10;padding:1.1rem 2.25rem;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-top:auto;}
@media(max-width:560px){#footer{padding:.9rem 1.25rem}}
.ft-l,.ft-r{display:flex;align-items:center;gap:1rem}
.ft-tag{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3)}
#clock{font-family:var(--mono);font-size:.6rem;color:var(--txt3);font-variant-numeric:tabular-nums}

/* ═══════════════════════════════════════════════════════════
   PORTFOLIO HERO & GRID
═══════════════════════════════════════════════════════════ */
#hero{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:2rem 1.5rem 4rem;width:100%;max-width:1200px;margin:0 auto;flex:1;}

#logo-block{display:flex;flex-direction:column;align-items:center;gap:.5rem;margin-bottom:1.25rem;animation:fade-up .8s var(--ease) .5s both;}
@keyframes fade-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

#kaomoji{font-size:clamp(1.5rem,3.5vw,2rem);font-weight:300;color:var(--txt);line-height:1;display:block;letter-spacing:.04em;}
.page-title{font-family:var(--serif);font-size:clamp(2.5rem,5vw,3.5rem);font-weight:400;color:var(--txt);line-height:1;}
#logo-rule{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--bdr3),transparent);margin-top:.25rem;}
#tagline{font-size:clamp(.68rem,1.5vw,.78rem);letter-spacing:.22em;text-transform:uppercase;color:var(--txt3);font-weight:400;margin-bottom:4rem;animation:fade-up .8s var(--ease) .6s both;text-align:center;}

.back-btn{position:absolute;top:2rem;left:1.5rem;display:inline-flex;align-items:center;gap:.5rem;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--txt3);text-decoration:none;font-family:var(--mono);padding:.5rem 0;border-bottom:1px solid transparent;transition:all .25s;z-index:20;}
.back-btn:hover{color:var(--txt);border-color:var(--bdr3);gap:.75rem;}
@media(max-width:768px){ .back-btn{position:relative;top:0;left:0;margin-bottom:2rem;align-self:flex-start;} }

/* Grid styling */
#portfolio-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:1.5rem;
  width:100%; animation:fade-up .8s var(--ease) .75s both;
}

.port-card{
  background:var(--card-bg); border:1px solid var(--bdr); padding:.75rem;
  display:flex; flex-direction:column; gap:1rem; cursor:pointer;
  transition:background .25s, border-color .25s, transform .35s var(--spring);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.port-card:hover{background:var(--card-hov); border-color:var(--bdr2); transform:translateY(-4px);}

.port-img-wrap{
  width:100%; aspect-ratio:4/3; overflow:hidden; border:1px solid var(--bdr2);
  background:var(--bg2); position:relative;
}
.port-img{
  width:100%; height:100%; object-fit:cover; transition:transform .5s var(--ease), opacity .3s;
}
.port-card:hover .port-img{transform:scale(1.03);}

.port-info{display:flex; flex-direction:column; gap:.4rem; padding:0 .5rem .5rem;}
.port-header{display:flex; justify-content:space-between; align-items:baseline; gap:1rem;}
.port-title{font-size:1rem; font-weight:500; color:var(--txt); letter-spacing:-.01em;}
.port-date{font-size:.58rem; font-family:var(--mono); color:var(--txt3); letter-spacing:.1em;}
.port-desc{font-size:.72rem; color:var(--txt2); line-height:1.6; font-weight:300; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

.port-tags{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem;}
.tag{
  font-size:.55rem; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--txt3); padding:.2rem .4rem; border:1px solid var(--bdr); border-radius:2px;
}

/* Rebuilding / Sneak Peek Notice */
.sneak-peek-notice{
  margin-top:4rem; padding:2rem; width:100%; max-width:600px; text-align:center;
  border:1px dashed var(--bdr2); border-radius:4px;
  animation:fade-up .8s var(--ease) .9s both;
}
.sneak-peek-title{font-family:var(--mono); font-size:.65rem; letter-spacing:.2em; text-transform:uppercase; color:var(--txt3); margin-bottom:.75rem;}
.sneak-peek-text{font-size:.8rem; color:var(--txt2); line-height:1.6; font-weight:300;}

/* PAGE TRANSITION */
#pt{position:fixed;inset:0;z-index:9000;pointer-events:none;display:flex;align-items:center;justify-content:center}
#pt-wipe{position:absolute;inset:0;background:var(--bg);transform:scaleY(0);transform-origin:bottom;transition:transform .55s cubic-bezier(.76,0,.24,1);}
#pt.go #pt-wipe{transform:scaleY(1)}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-face">[o_o]</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
</div>

<canvas id="bg-canvas"></canvas>
<div id="glow"></div>
<div id="cursor"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div id="pt"><div id="pt-wipe"></div></div>

<nav id="nav">
  <div class="nav-l"><span class="nav-tag">blanklabs / portfolio</span></div>
  <div class="nav-r"><button id="thm" aria-label="Toggle theme"></button></div>
</nav>

<main id="hero">
  <a href="../index.html" class="back-btn" id="back-link">← return home</a>

  <div id="logo-block">
    <span id="kaomoji">[o_o]</span>
    <h1 class="page-title">Portfolio</h1>
    <div id="logo-rule"></div>
  </div>
  <div id="tagline">selected works · photography</div>

  <div id="portfolio-grid">
    </div>

  <div class="sneak-peek-notice">
    <div class="sneak-peek-title">Archive Locked</div>
    <div class="sneak-peek-text">You are currently viewing a curated selection of recent work. The full photography archive is undergoing optimization and will be unlocked soon.</div>
  </div>
</main>

<footer id="footer">
  <div class="ft-l"><span class="ft-tag">blanklabs.site</span></div>
  <div class="ft-r"><span class="ft-tag" id="theme-label">dark</span><span id="clock"></span></div>
</footer>

<script>
(function(){
'use strict';

const isTouch = window.matchMedia('(hover:none)').matches || ('ontouchstart' in window);
if (isTouch) document.body.classList.add('touch-device');

/* ═══════════════════════════════════════════════
   PORTFOLIO DATA & RENDERING
═══════════════════════════════════════════════ */
// Fallback data strictly from user prompt to ensure it works instantly
const fallbackData = [
  {"id":"proj001","title":"Rain Through Glass","description":"There is a special kind of calm that only happens when you are stuck in a car during a downpour. Outside turns into this neon blur, and for a little while, it feels pretty nice to just stay right there.","images":["pictures/RainyK.jpg"],"tags":["photography","night","urban","mood"],"date":"2026-02-06"},
  {"id":"proj002","title":"Blowhole Day","description":"The ocean hitting the rocks is one of those things you really have to feel in person. It is loud, wild, and weirdly calming in its own way. One of those moments where you just stop and stare.","images":["pictures/mountains.jpg"],"tags":["photography","travel","family","nature","ocean"],"date":"2026-02-06"},
  {"id":"proj003","title":"Shark Tank","description":"IKEA is such a strange little gallery. One minute you are looking at a huge chaotic pile of plush sharks, and the next you are wondering how you ended up wanting to jump into it.","images":["pictures/20240512_110913.jpg"],"tags":["photography","retail","fun","lifestyle"],"date":"2026-03-24"},
  {"id":"proj004","title":"Artistic Assembly","description":"A wall of wooden mannequins waving, dancing, and trying to steal your attention. It feels like stumbling into a tiny silent party in the middle of a store.","images":["pictures/20240512_115725.jpg"],"tags":["photography","art","retail","creative"],"date":"2026-03-24"},
  {"id":"proj005","title":"Soaring High","description":"Bronze wings stretched out against a clean blue sky. There is a weight and a pride to this shot that feels pretty timeless, especially with the flag moving behind it.","images":["pictures/20241013_174817.jpg"],"tags":["photography","monument","patriotic","outdoors"],"date":"2026-03-24"},
  {"id":"proj006","title":"The Breakfast Bowl","description":"Pretty much the perfect morning fuel. Tater tots, eggs, and a creamy drizzle, basically everything you want before heading out to see what the day has going on.","images":["pictures/20241103_094702.jpg"],"tags":["photography","food","breakfast","lifestyle"],"date":"2026-03-24"}
];

function renderGrid(data) {
  const grid = document.getElementById('portfolio-grid');
  grid.innerHTML = ''; // Clear loading state if any
  
  // SNEAK PEEK LOGIC: Only take the first 6 items
  const peekData = data.slice(0, 6);

  peekData.forEach(item => {
    // Format date nicely
    const dateObj = new Date(item.date);
    const dateStr = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
    
    // Create Tag HTML
    const tagsHTML = item.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('');
    
    // Safely handle missing images
    const imgSrc = item.images && item.images.length > 0 ? item.images[0] : '';

    const cardHTML = `
      <div class="port-card" tabindex="0">
        <div class="port-img-wrap">
          <img src="${imgSrc}" alt="${item.title}" class="port-img" loading="lazy" onerror="this.style.opacity='0'; this.parentElement.style.background='var(--surface2)'">
        </div>
        <div class="port-info">
          <div class="port-header">
            <h2 class="port-title">${item.title}</h2>
            <span class="port-date">${dateStr}</span>
          </div>
          <p class="port-desc">${item.description}</p>
          <div class="port-tags">${tagsHTML}</div>
        </div>
      </div>
    `;
    grid.innerHTML += cardHTML;
  });

  // Re-bind cursor hover states to new elements
  document.querySelectorAll('.port-card').forEach(el => {
    el.addEventListener('mouseenter', () => document.getElementById('cursor').classList.add('big'));
    el.addEventListener('mouseleave', () => document.getElementById('cursor').classList.remove('big'));
  });
}

// Try to load external JSON, fallback to internal data if it fails (e.g. CORS/Local issues)
fetch('portfolio.json')
  .then(response => {
    if(!response.ok) throw new Error("Network response was not ok");
    return response.json();
  })
  .then(data => renderGrid(data))
  .catch(err => {
    console.warn("Could not load portfolio.json, using fallback data. Error:", err);
    renderGrid(fallbackData);
  });


/* ═══════════════════════════════════════════════
   CANVAS BACKGROUND (Retained from main layout)
═══════════════════════════════════════════════ */
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let mouse = {x: -9999, y: -9999};
let shapes = [];

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (!shapes.length) initShapes();
}

function initShapes(){
  shapes = [];
  const W = canvas.width, H = canvas.height;
  for (let i = 0; i < 18; i++){
    shapes.push({
      type: ['rect','circle','ring','dot'][Math.floor(Math.random()*4)],
      x: Math.random()*W, y: Math.random()*H,
      ox: 0, oy: 0,
      size: 18 + Math.random() * 80,
      rot: Math.random()*Math.PI*2,
      rs: (Math.random()-.5)*.004,
      vx: (Math.random()-.5)*.16,
      vy: (Math.random()-.5)*.11,
      a: .4 + Math.random()*.6,
    });
  }
}

function drawShape(s){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const fa = dark ? `rgba(255,255,255,${s.a*.016})` : `rgba(0,0,0,${s.a*.022})`;
  const sa = dark ? `rgba(255,255,255,${s.a*.032})` : `rgba(0,0,0,${s.a*.04})`;
  ctx.save();
  ctx.translate(s.x + s.ox, s.y + s.oy);
  ctx.rotate(s.rot);
  ctx.fillStyle = fa; ctx.strokeStyle = sa; ctx.lineWidth = 1;

  if (s.type==='rect'){ ctx.fillRect(-s.size/2,-s.size/2,s.size,s.size); ctx.strokeRect(-s.size/2,-s.size/2,s.size,s.size); } 
  else if (s.type==='circle'){ ctx.beginPath(); ctx.arc(0,0,s.size/2,0,Math.PI*2); ctx.fill(); ctx.stroke(); } 
  else if (s.type==='ring'){ ctx.beginPath(); ctx.arc(0,0,s.size/2,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(0,0,s.size*.32,0,Math.PI*2); ctx.stroke(); } 
  else if (s.type==='dot'){ ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fillStyle = dark ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.05)'; ctx.fill(); }
  ctx.restore();
}

function tick(){
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  shapes.forEach(s => {
    s.x += s.vx; s.y += s.vy; s.rot += s.rs;
    if (s.x < -120) s.x = W+120; if (s.x > W+120) s.x = -120;
    if (s.y < -120) s.y = H+120; if (s.y > H+120) s.y = -120;

    const dx = s.x - mouse.x, dy = s.y - mouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 140 && dist > 0){
      const f = (140 - dist) / 140;
      s.ox += ((dx/dist) * f * 140 * 0.18 - s.ox) * .1;
      s.oy += ((dy/dist) * f * 140 * 0.18 - s.oy) * .1;
    } else { s.ox *= .92; s.oy *= .92; }
    drawShape(s);
  });
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize, {passive:true});
resize();
if (!window.matchMedia('(prefers-reduced-motion:reduce)').matches) tick();

/* ═══════════════════════════════════════════════
   GLOBAL INTERACTIONS
═══════════════════════════════════════════════ */
const glow = document.getElementById('glow');
const cursor = document.getElementById('cursor');

document.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  glow.style.setProperty('--mx', e.clientX+'px'); glow.style.setProperty('--my', e.clientY+'px');
  if (!isTouch){
    cursor.style.left = e.clientX+'px'; cursor.style.top = e.clientY+'px';
    cursor.classList.add('active');
  }
}, {passive:true});

document.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; cursor.classList.remove('active','big'); });

document.querySelectorAll('button, a').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('big'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('big'));
});

// Theme Logic
let theme = localStorage.getItem('bl-t') || 'dark';
function applyTheme(t){
  theme = t; document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-label').textContent = t; localStorage.setItem('bl-t', t);
}
applyTheme(theme);
document.getElementById('thm').addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

// Clock
function tick2(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
setInterval(tick2, 1000); tick2();

// Navigation Transition
document.getElementById('back-link').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('pt').classList.add('go');
  setTimeout(() => window.location.href = e.target.href, 600);
});

// Remove Loader
window.addEventListener('load', () => setTimeout(() => document.getElementById('loader').classList.add('done'), 600));

})();
</script>
</body>
</html>
